<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공대 시간표</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="레이드 가능한 시간을 칠하면 공대원 모두가 되는 시간을 찾아줘요. 로그인 없이 바로 입력하세요.">
<meta name="theme-color" content="#b27b1c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1015" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="공대 시간표"><meta property="og:title" content="⚔ 공대 시간표"><meta property="og:description" content="되는 시간만 칠하면 모두 되는 시간이 노랗게 떠요. 로그인 없이 바로 입력!"><meta property="og:url" content="https://kuyh2185.github.io/timetable/"><meta property="og:image" content="https://kuyh2185.github.io/timetable/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f2ed;
  --surface:#fffefb;
  --surface-2:#f1ede5;
  --surface-3:#e6e0d4;
  --border:#e2dbcd;
  --border-strong:#cfc6b4;
  --text:#1d1a15;
  --text-dim:#6c665a;
  --text-faint:#9a9384;
  --accent:#b27b1c;
  --accent-strong:#8c5e0f;
  --accent-ink:#ffffff;
  --accent-soft:rgba(178,123,28,.12);
  --heat-low:#f6dfcb;
  --heat-high:#bf4a22;
  --heat-ink:#5a3b24;
  --full-color:#f6c629;
  --full-ring:#9a6a12;
  --full-ink:#3a2a04;
  --danger:#b3432f;
  --danger-soft:rgba(179,67,47,.1);
  --ok:#3f7d4e;
  --shadow-sm:0 1px 2px rgba(60,44,20,.06);
  --shadow:0 1px 2px rgba(60,44,20,.05),0 10px 30px -16px rgba(60,44,20,.22);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --radius-xs:6px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --z-sticky:20;
  --z-toast:50;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1015;
    --surface:#171922;
    --surface-2:#1f2230;
    --surface-3:#292d3e;
    --border:#2a2e40;
    --border-strong:#3a3f55;
    --text:#ece8dd;
    --text-dim:#a09dab;
    --text-faint:#6f6d7c;
    --accent:#d9a441;
    --accent-strong:#f0c063;
    --accent-ink:#1a1204;
    --accent-soft:rgba(217,164,65,.14);
    --heat-low:#3a2b25;
    --heat-high:#dd6a36;
    --heat-ink:#f0e2d4;
    --full-color:#ffd84a;
    --full-ring:#d9a441;
    --full-ink:#2a1e02;
    --danger:#e2725a;
    --danger-soft:rgba(226,114,90,.12);
    --ok:#6fbf83;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1015;--surface:#171922;--surface-2:#1f2230;--surface-3:#292d3e;--border:#2a2e40;--border-strong:#3a3f55;
  --text:#ece8dd;--text-dim:#a09dab;--text-faint:#6f6d7c;--accent:#d9a441;--accent-strong:#f0c063;--accent-ink:#1a1204;
  --accent-soft:rgba(217,164,65,.14);--heat-low:#3a2b25;--heat-high:#dd6a36;--heat-ink:#f0e2d4;--full-color:#ffd84a;
  --full-ring:#d9a441;--full-ink:#2a1e02;--danger:#e2725a;--danger-soft:rgba(226,114,90,.12);--ok:#6fbf83;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.5;
  padding-inline:16px;
  padding-block:0 48px;
  min-height:100dvh;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
button,input,select,textarea{font-family:inherit;}
.wrap{max-width:760px;margin:0 auto;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ---------- header ---------- */
.masthead{padding-block:20px 12px;display:flex;flex-direction:column;gap:12px;}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:grid;place-items:center;font-size:18px;
  background:linear-gradient(160deg,var(--accent) 0%,var(--accent-strong) 100%);
  color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 14px -6px var(--accent);
}
.brand-text{display:flex;flex-direction:column;min-width:0;}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
.brand-sub{font-size:12.5px;color:var(--text-dim);font-weight:500;}
.mast-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.me-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;box-shadow:var(--shadow-sm);
}
.me-pill b{font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:color .2s var(--ease),border-color .2s var(--ease),transform .1s ease;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:16px;height:16px;}
.mini-btn{
  appearance:none;border:none;background:var(--surface-2);color:var(--text-dim);
  font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;cursor:pointer;
  transition:background .2s var(--ease),color .2s var(--ease);
}
.mini-btn:hover{background:var(--surface-3);color:var(--text);}

.banner{
  border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:14px;
}
.banner-final{
  background:
    radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.22) 0%,transparent 55%),
    linear-gradient(135deg,var(--accent) 0%,var(--accent-strong) 100%);
  color:var(--accent-ink);
  box-shadow:0 12px 28px -16px var(--accent);
}
.banner-final .b-ic{font-size:22px;line-height:1;}
.banner-final .tag{font-size:12px;font-weight:600;opacity:.85;}
.banner-final .slot{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.3;}
.banner-error{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);font-size:13.5px;font-weight:600;}
.banner-error .grow{flex:1;}

/* ---------- tabs ---------- */
.tabs-bar{
  position:sticky;top:0;z-index:var(--z-sticky);
  padding-block:8px;margin-inline:-16px;padding-inline:16px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
}
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;
}
.tab-btn{
  appearance:none;border:none;background:none;color:var(--text-dim);
  font-size:14px;font-weight:600;padding:9px 6px;cursor:pointer;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease);
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm),0 0 0 1px var(--border);}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

/* ---------- host strip ---------- */
.host-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-dim);}
.host-strip b{color:var(--text);font-weight:700;}
.host-badge{font-size:11.5px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-left:6px;}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;box-shadow:var(--shadow-sm);animation:rise .25s var(--ease);
}
.panel.danger{border-color:var(--danger);background:linear-gradient(var(--danger-soft),var(--danger-soft)),var(--surface);}
.panel p{margin:0 0 12px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
.panel .danger-text{color:var(--danger);font-weight:600;}
.panel .field-label{font-size:12.5px;color:var(--text-dim);font-weight:600;display:block;margin-bottom:6px;}
.panel .err{color:var(--danger);font-size:12.5px;font-weight:600;margin:-4px 0 10px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.btn-row.spread{justify-content:space-between;}

/* ---------- main & cards ---------- */
main{padding-block:10px 0;display:flex;flex-direction:column;gap:14px;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px 18px 22px;
  box-shadow:var(--shadow);
  animation:rise .3s var(--ease) both;
}
main > .card:nth-child(2){animation-delay:.04s;}
main > .card:nth-child(3){animation-delay:.08s;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
h2.section-title{font-size:17px;font-weight:750;letter-spacing:-.015em;margin:0;line-height:1.35;}
.count-tag{font-size:12.5px;font-weight:600;color:var(--text-dim);background:var(--surface-2);border-radius:999px;padding:2px 9px;flex-shrink:0;}
p.hint{color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0 0 16px;max-width:60ch;text-wrap:pretty;}

/* ---------- name gate ---------- */
.name-gate{
  min-height:88dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:18px;padding:40px 8px;
}
.name-gate .brand-mark{width:64px;height:64px;border-radius:20px;font-size:32px;}
.name-gate h1{font-size:30px;font-weight:850;letter-spacing:-.03em;margin:0;line-height:1.15;}
.name-gate p{color:var(--text-dim);font-size:15px;max-width:30ch;line-height:1.65;margin:0;text-wrap:balance;}
.name-form{display:flex;flex-direction:column;gap:10px;margin-top:8px;width:100%;max-width:340px;}
.name-form .input-row{display:flex;gap:8px;}
.gate-steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.gate-steps span{font-size:12px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px;}
.gate-steps b{color:var(--accent-strong);margin-right:4px;}
.name-warn{text-align:left;}

input[type="text"],input[type="password"],input[type="date"],textarea.note-input,select{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
}
input[type="text"]{flex:1;min-width:0;}
input[type="password"],input[type="date"]{width:100%;margin-bottom:10px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface);}

.btn{
  appearance:none;border:1px solid transparent;cursor:pointer;
  font-weight:700;font-size:14.5px;border-radius:var(--radius-sm);
  padding:10px 18px;line-height:1.3;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s ease,background .2s var(--ease),border-color .2s var(--ease),opacity .2s var(--ease),box-shadow .2s var(--ease);
}
.btn:active:not([disabled]){transform:scale(.97);}
.btn[disabled]{opacity:.5;cursor:default;}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px -8px var(--accent);}
.btn-primary:hover:not([disabled]){background:var(--accent-strong);}
.btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.btn-ghost:hover:not([disabled]){background:var(--surface-3);border-color:var(--border-strong);}
.btn-quiet{background:none;color:var(--text-dim);padding-inline:10px;}
.btn-quiet:hover:not([disabled]){color:var(--text);background:var(--surface-2);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover:not([disabled]){opacity:.9;}
.btn-danger-quiet{background:none;color:var(--danger);padding-inline:10px;}
.btn-danger-quiet:hover:not([disabled]){background:var(--danger-soft);}
.btn-sm{padding:7px 12px;font-size:13px;}
.btn-block{width:100%;}
.linklike{
  background:none;border:none;color:var(--accent-strong);font-weight:600;
  cursor:pointer;font-size:13px;padding:2px 0;
  text-decoration:underline;text-decoration-color:var(--accent-soft);text-decoration-thickness:2px;text-underline-offset:3px;
}
.linklike:hover{text-decoration-color:var(--accent);}
:is(.btn,.linklike,.tab-btn,.icon-btn,.mini-btn,.g-cell,input[type="checkbox"]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- grid ---------- */
.grid-scroll{overflow-x:auto;margin-inline:-4px;padding:2px 4px;}
.grid{
  display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));gap:4px;
  user-select:none;-webkit-user-select:none;min-width:340px;
  -webkit-tap-highlight-color:transparent;
}
.g-daylabel{
  font-size:13px;font-weight:700;color:var(--text);text-align:center;
  padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25;
  border-radius:8px;
}
.g-daylabel .date{font-size:11px;font-weight:500;color:var(--text-faint);}
.g-daylabel.weekend{color:var(--danger);}
.g-daylabel.today{background:var(--accent-soft);color:var(--accent-strong);}
.g-daylabel.today .date{color:var(--accent-strong);font-weight:700;}
.g-hourlabel{
  font-size:11px;color:var(--text-dim);font-weight:500;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px;white-space:nowrap;
}
.g-hourlabel.nextday{color:var(--accent-strong);}
.g-divider{
  grid-column:1 / -1;display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;color:var(--accent-strong);margin:4px 0 0;
}
.g-divider::before,.g-divider::after{content:"";height:1px;flex:1;background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.6;}
.g-divider::before{flex:0 0 40px;}
.g-cell{
  height:34px;border-radius:var(--radius-xs);background:var(--surface-2);
  border:1px solid var(--border);cursor:pointer;position:relative;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--heat-ink);
  transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .1s ease;
}
.g-cell.today-col:not(.selected):not(.heat):not(.full){background:color-mix(in srgb,var(--accent) 7%,var(--surface-2));}
@media (hover:hover){ .g-cell:hover{border-color:var(--accent);} }
.drag-enabled .g-cell{touch-action:none;-webkit-touch-callout:none;}
.g-cell.selected{
  background:var(--accent);border-color:var(--accent-strong);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.g-cell.heat{border-color:transparent;}
.g-cell.hot{color:#fff;}
.g-cell.full{background:var(--full-color);border-color:var(--full-ring);color:var(--full-ink);box-shadow:0 0 0 1px var(--full-ring) inset;}
.g-cell.mine::before{
  content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;
  background:currentColor;opacity:.75;
}
.g-cell.picked{outline:2px solid var(--text);outline-offset:1px;z-index:1;}
.g-cell.candidate{box-shadow:0 0 0 2px var(--surface) inset,0 0 0 4px var(--text) inset;}
.g-cell.readonly{cursor:default;}

.legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-dim);margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-bar{height:10px;width:96px;border-radius:6px;background:linear-gradient(90deg,var(--heat-low),var(--heat-high));}
.legend-swatch{width:12px;height:12px;border-radius:4px;background:var(--full-color);border:1px solid var(--full-ring);}
.legend-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);}

.detail-panel{
  margin-top:12px;padding:12px 14px;background:var(--surface-2);
  border-radius:var(--radius-sm);font-size:13.5px;color:var(--text);min-height:48px;line-height:1.6;
}
.detail-panel .when{font-weight:700;}
.detail-panel .cnt{font-weight:800;color:var(--accent-strong);margin-left:4px;}
.detail-panel .names{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.detail-panel .no-list{color:var(--text-dim);font-size:12.5px;margin-top:6px;}
.detail-panel .placeholder{color:var(--text-dim);}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px;}
.stat{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;min-width:0;}
.stat .k{font-size:12px;color:var(--text-dim);font-weight:600;}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.3;}
.stat .v small{font-size:12.5px;font-weight:600;color:var(--text-dim);margin-left:2px;}
.stat.hl{background:var(--accent-soft);}
.stat.hl .v{color:var(--accent-strong);}

/* ---------- chips & people ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;
}
.chip.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-strong);}
.chip.muted{color:var(--text-dim);background:transparent;border-style:dashed;}
.people-list{display:flex;flex-direction:column;margin-top:10px;}
.person-row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--border);}
.person-row:first-child{border-top:none;}
.person-row .chip{flex-shrink:0;}
.person-row .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.person-row .note-text{font-size:13.5px;color:var(--text);line-height:1.55;}
.person-row .note-text.empty{color:var(--text-faint);}
.person-row .hours{font-size:12px;color:var(--text-dim);flex-shrink:0;margin-top:2px;}

.empty-note{
  text-align:center;color:var(--text-dim);font-size:13.5px;line-height:1.6;
  padding:26px 14px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);
  background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 11px);
}
.empty-note .big{display:block;font-size:22px;margin-bottom:4px;}

/* ---------- input tab ---------- */
.load-last{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 8px 8px 12px;margin:0 0 14px;
  font-size:12.5px;color:var(--text-dim);
}
.note-field{margin-top:16px;}
.note-field label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
.note-field label span{font-weight:500;color:var(--text-faint);font-size:12px;}
textarea.note-input{width:100%;resize:vertical;min-height:64px;font-size:14px;line-height:1.55;}
.savebar{
  position:sticky;bottom:12px;z-index:5;margin-top:16px;
  display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 8px 8px 14px;
  box-shadow:var(--shadow);
}
.savebar .status{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;}
.savebar .status .s1{font-size:13px;font-weight:700;}
.savebar .status .s2{font-size:12px;color:var(--text-dim);}
.savebar .status.dirty .s1{color:var(--accent-strong);}
.savebar .status.clean .s1{color:var(--ok);}
.savebar.dirty{border-color:var(--accent);}

/* ---------- runs & ranks ---------- */
.runs-head{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:13px;color:var(--text-dim);}
.runs-head select{padding:6px 30px 6px 10px;font-size:13.5px;font-weight:600;}
.run-list,.rankbox,.cand-list{display:flex;flex-direction:column;gap:8px;}
.run-item{
  display:flex;align-items:center;gap:12px;
  background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);padding:11px 12px;
}
.run-item.full{border-color:var(--full-ring);background:linear-gradient(90deg,color-mix(in srgb,var(--full-color) 22%,transparent),transparent 70%),var(--surface-2);}
.run-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.run-label{font-weight:700;font-size:14px;}
.run-miss{font-size:12.5px;color:var(--text-dim);}
.run-len{font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.badge{flex-shrink:0;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--surface-3);color:var(--text);}
.badge.full{background:var(--full-color);color:var(--full-ink);}
.rank-item{display:flex;align-items:center;gap:12px;font-size:13.5px;padding:9px 12px;background:var(--surface-2);border-radius:var(--radius-sm);}
.rank-item .no{width:20px;font-weight:800;color:var(--text-faint);flex-shrink:0;}
.rank-item .when{flex:1;min-width:0;font-weight:600;}
.rank-item .n b{color:var(--accent-strong);font-weight:800;}
.rank-item .n{color:var(--text-dim);flex-shrink:0;}
.cta-zone{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}

/* ---------- vote ---------- */
.cand-row{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--radius-sm);padding:10px 12px;
  transition:border-color .2s var(--ease),background .2s var(--ease);
}
.cand-row.checked{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface-2);}
.cand-row.winner{border-color:var(--full-ring);}
.cand-check{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1;min-width:0;}
.cand-check input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;margin:0;}
.cand-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.cand-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.cand-top .label{font-weight:700;font-size:14px;}
.cand-top .count{font-size:13px;font-weight:700;color:var(--text);flex-shrink:0;}
.cand-sub{font-size:12px;color:var(--text-dim);}
.cand-bar-track{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;}
.cand-bar-fill{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s var(--ease);}
.cand-bar-fill.dim{opacity:.55;}
.voters{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--text-dim);}
.voters .line{display:flex;gap:8px;align-items:flex-start;}
.voters .line > span:first-child{flex-shrink:0;width:52px;font-weight:600;padding-top:3px;}
.voters .chips{display:flex;flex-wrap:wrap;gap:4px;}
.my-ballot-state{font-size:12.5px;font-weight:600;}
.my-ballot-state.done{color:var(--ok);}
.my-ballot-state.todo{color:var(--accent-strong);}

/* ---------- history ---------- */
.hist-final{font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--accent-strong);margin-top:6px;}
.hist-stats{margin:12px 0 10px;display:flex;flex-direction:column;gap:6px;}
.hist-stats div{display:flex;gap:12px;font-size:13.5px;line-height:1.55;}
.hist-stats dt{width:64px;flex-shrink:0;color:var(--text-dim);font-weight:600;}
.hist-stats dd{margin:0;min-width:0;}
.hist-detail{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
.pill{font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--surface-2);color:var(--text-dim);flex-shrink:0;}
.pill.done{background:var(--accent-soft);color:var(--accent-strong);}

/* ---------- skeleton ---------- */
.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:var(--radius-xs);}
.skel-line{height:14px;margin-bottom:10px;}
.skel-grid{display:grid;grid-template-columns:48px repeat(7,1fr);gap:4px;margin-top:16px;}
.skel-grid .skel{height:30px;}
@keyframes shimmer{to{background-position:-200% 0;}}

/* ---------- toast & spinner ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);z-index:var(--z-toast);max-width:calc(100vw - 32px);text-align:center;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;
  display:inline-block;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}

@media (max-width:440px){
  body{font-size:14.5px;}
  .brand-name{font-size:17px;}
  .brand-sub{font-size:12px;}
  .me-pill{padding-left:10px;}
  .me-pill b{max-width:5.5em;}
  .tab-btn{font-size:13.5px;padding:9px 2px;}
  .card{padding:18px 14px 20px;border-radius:18px;}
  .grid{grid-template-columns:36px repeat(7,minmax(0,1fr));gap:3px;min-width:0;}
  .skel-grid{grid-template-columns:36px repeat(7,1fr);}
  .g-hourlabel{font-size:10px;padding-right:3px;}
  .g-cell{height:31px;font-size:10.5px;}
  .g-daylabel{font-size:12.5px;}
  .g-daylabel .date{font-size:10px;}
  .stat{padding:9px 10px;}
  .stat .v{font-size:18px;}
  .run-item{flex-wrap:wrap;row-gap:6px;}
  .run-main{flex-basis:100%;}
}

<script type="module">

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

var firebaseConfig = {

var fbApp = initializeApp(firebaseConfig);

(function(){
"use strict";

var DAYS = ["수","목","금","토","일","월","화"];
var HOUR_STEP = 2;
var HOUR_START = 6;
var HOUR_END = 30;
var BLOCKS = (HOUR_END - HOUR_START) / HOUR_STEP;
var NAME_KEY = "raidPlannerName_v1";
var DRAFT_PREFIX = "raidPlannerDraft_v2:";
var HOST_UNLOCK_KEY = "raidPlannerHostUnlocked_v1";
var HOST_PIN = "2032";
var RAID_LEN_KEY = "raidPlannerRaidLen_v1";
var DISCORD_WEBHOOK_URL = "";

var ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';

function slotId(d,h){ return "d" + d + "h" + h; }
function parseSlot(id){
  var m = /^d(\d+)h(\d+)$/.exec(id);
  if(!m) return null;
  return { d: parseInt(m[1],10), h: parseInt(m[2],10) };
}
function normalizeSlot(id){
  var p = parseSlot(id);
  if(!p) return null;
  if(p.d < 0 || p.d > 6) return null;
  if(p.h < HOUR_START || p.h >= HOUR_END) return null;
  var rel = p.h - HOUR_START;
  var h2 = HOUR_START + Math.floor(rel / HOUR_STEP) * HOUR_STEP;
  return slotId(p.d, h2);
}
// "d0h10" < "d0h6" 같은 문자열 정렬 대신 요일·시간 순으로 정렬해요.
function compareSlots(a, b){
  var pa = parseSlot(a), pb = parseSlot(b);
  if(!pa || !pb) return String(a).localeCompare(String(b));
  return pa.d - pb.d || pa.h - pb.h;
}
function sortedSlots(list){ return (list || []).slice().sort(compareSlots); }
function sameSlots(a, b){
  a = sortedSlots(a); b = sortedSlots(b);
  if(a.length !== b.length) return false;
  for(var i=0;i<a.length;i++){ if(a[i] !== b[i]) return false; }
  return true;
}

function pad2(n){ return (n<10?"0":"") + n; }
function isoDateOnly(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function parseISODate(s){
  var parts = String(s||"").split("-");
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function addDays(d,n){ var r = new Date(d.getTime()); r.setDate(r.getDate()+n); return r; }
function computeMostRecentWednesday(d){ var dow = d.getDay(); var diff = (dow - 3 + 7) % 7; return addDays(d, -diff); }
function computeUpcomingWednesday(d){ var dow = d.getDay(); var diff = (3 - dow + 7) % 7; return addDays(d, diff); }
function getWeekStartDate(){
  var iso = (STATE.week && STATE.week.startDate) || null;
  if(iso){
    try{ return parseISODate(iso); }catch(e){}
  }
  return computeMostRecentWednesday(new Date());
}
function dateLabelForDay(d, weekStart){
  var dt = addDays(weekStart || getWeekStartDate(), d);
  return (dt.getMonth()+1) + "/" + dt.getDate();
}
function todayIndex(weekStart){
  var s0 = weekStart || getWeekStartDate();
  var start = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate());
  var today = new Date();
  // 새벽 6시 전은 전날 칸(다음날 새벽)으로 봐요.
  if(today.getHours() < HOUR_START) today = addDays(today, -1);
  var diff = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - start) / 86400000);
  return diff >= 0 && diff < 7 ? diff : -1;
}
function weekRangeLabel(){
  var start = getWeekStartDate();
  var end = addDays(start, 6);
  return (start.getMonth()+1) + "/" + start.getDate() + "(" + DAYS[0] + ") ~ " + (end.getMonth()+1) + "/" + end.getDate() + "(" + DAYS[6] + ")";
}
function normalizeSlotList(list){
  var seen = {};
  var out = [];
  (list||[]).forEach(function(id){
    var n = normalizeSlot(id);
    if(n && !seen[n]){ seen[n] = true; out.push(n); }
  });
  return out;
}
function formatSlot(id, weekStart){
  var p = parseSlot(id);
  if(!p) return id;
  var isNextDay = p.h >= 24;
  var dispH = isNextDay ? p.h - 24 : p.h;
  var suffix = isNextDay ? " (다음날 새벽)" : "";
  return DAYS[p.d] + "(" + dateLabelForDay(p.d, weekStart) + ") " + dispH + "~" + (dispH + HOUR_STEP) + "시" + suffix;
}
// 연속 구간 표시: 수(9/23) 20시 ~ 다음날 새벽 2시
function formatRun(d, startH, endH, weekStart){
  var day = DAYS[d] + "(" + dateLabelForDay(d, weekStart) + ") ";
  if(startH >= 24) return day + "다음날 새벽 " + (startH-24) + "~" + (endH-24) + "시";
  if(endH > 24) return day + startH + "시 ~ 다음날 새벽 " + (endH-24) + "시";
  return day + startH + "~" + endH + "시";
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === '"' ? "&quot;" : "&#39;";
  });
}
function sanitizeName(name){
  name = (name || "").trim().slice(0,24);
  name = name.replace(/[\/\.\[\]\*`]/g, "");
  return name;
}

var STATE = { people: {}, vote: null, week: null, archives: [] };
var loaded = { people: false, vote: false };
var myName = null;
try{ myName = localStorage.getItem(NAME_KEY); }catch(e){ myName = null; }

var currentTab = "input";
var isSaving = false;
var draftSlots = [];
var draftNote = "";
// 사용자가 직접 고친 뒤 아직 저장 안 했으면 true. false일 때는 서버 값이 들어오면 그대로 따라가요.
var draftTouched = false;
var candidatePickerOpen = false;
var candidateDraft = [];
var pickedHeatSlot = null;
var connError = false;
var dragActive = false;
var renderQueued = false;
var pendingNameConfirm = null;

var hostUnlocked = false;
try{ hostUnlocked = localStorage.getItem(HOST_UNLOCK_KEY) === "1"; }catch(e){ hostUnlocked = false; }
var hostMenuOpen = false;
var pendingHostAction = null;
var pinError = null;
var resetWeekConfirmOpen = false;
var resetWeekDateValue = "";
var isResetting = false;
var pendingFinalizeConfirm = null;
var pendingSaveConfirm = null; // null | "overlap" | "empty"
var expandedArchives = {};
var raidLenBlocks = 2;
try{ var _rl = parseInt(localStorage.getItem(RAID_LEN_KEY),10); if(_rl >= 1 && _rl <= 6) raidLenBlocks = _rl; }catch(e){}

function participantNames(){ return Object.keys(STATE.people || {}); }
function participantCount(){ return participantNames().length; }

function expectedNames(){ return participantNames(); }
function expectedCount(){ return participantCount(); }

function countsFor(people){
  var counts = {};
  Object.keys(people || {}).forEach(function(n){
    var slots = (people[n] && people[n].slots) || [];
    for(var j=0;j<slots.length;j++){
      counts[slots[j]] = (counts[slots[j]] || 0) + 1;
    }
  });
  return counts;
}
function countsPerSlot(){ return countsFor(STATE.people); }

function namesForSlotIn(people, slot){
  var out = [];
  Object.keys(people || {}).forEach(function(n){
    var slots = (people[n] && people[n].slots) || [];
    if(slots.indexOf(slot) !== -1) out.push(n);
  });
  return out;
}
function namesForSlot(slot){ return namesForSlotIn(STATE.people, slot); }

// 같은 요일 칸에서 minBlocks칸 이상 이어지는 구간을 찾아요.
// 전원 가능한 구간이 있으면 그걸, 없으면 가장 많은 인원이 되는 구간을 돌려줘요.
function findRuns(people, expected, minBlocks){
  var counts = countsFor(people);
  for(var t = expected; t >= 1; t--){
    var runs = [];
    for(var d=0; d<7; d++){
      var start = -1;
      for(var bi=0; bi<=BLOCKS; bi++){
        var ok = bi < BLOCKS && (counts[slotId(d, HOUR_START + bi*HOUR_STEP)] || 0) >= t;
        if(ok && start === -1) start = bi;
        if(!ok && start !== -1){
          var len = bi - start;
          if(len >= minBlocks){
            runs.push({ d: d, startH: HOUR_START + start*HOUR_STEP, endH: HOUR_START + bi*HOUR_STEP, blocks: len });
          }
          start = -1;
        }
      }
    }
    if(runs.length){
      runs.sort(function(a,b){ return b.blocks - a.blocks || a.d - b.d || a.startH - b.startH; });
      return { threshold: t, runs: runs };
    }
  }
  return { threshold: 0, runs: [] };
}
function missingInRun(people, expectedList, run){
  var missing = [];
  for(var h = run.startH; h < run.endH; h += HOUR_STEP){
    var ok = namesForSlotIn(people, slotId(run.d, h));
    expectedList.forEach(function(n){
      if(ok.indexOf(n) === -1 && missing.indexOf(n) === -1) missing.push(n);
    });
  }
  return missing;
}

function lerp(a,b,t){ return Math.round(a + (b-a)*t); }
function hexToRgb(hex){
  hex = hex.replace("#","");
  return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
}
function heatColor(t, lowHex, highHex){
  var lo = hexToRgb(lowHex), hi = hexToRgb(highHex);
  var r = lerp(lo[0],hi[0],t), g = lerp(lo[1],hi[1],t), b = lerp(lo[2],hi[2],t);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ---------- draft (내 입력) ---------- */
function serverMine(){ return STATE.people[myName] || null; }
function draftKey(){ return DRAFT_PREFIX + (myName || ""); }
function noteDraftKey(){ return DRAFT_PREFIX + "note:" + (myName || ""); }
function restoreLocalDraft(){
  var restored = false;
  try{
    var raw = sessionStorage.getItem(draftKey());
    if(raw){ draftSlots = normalizeSlotList(JSON.parse(raw)); restored = true; }
  }catch(e){}
  try{
    var rawNote = sessionStorage.getItem(noteDraftKey());
    if(rawNote !== null){ draftNote = rawNote; restored = true; }
  }catch(e){}
  if(!restored){ syncDraftFromServer(); }
  draftTouched = restored;
}
function syncDraftFromServer(){
  var mine = serverMine();
  draftSlots = mine ? mine.slots.slice() : [];
  draftNote = mine ? (mine.note || "") : "";
}
function saveDraftLocal(){
  try{ sessionStorage.setItem(draftKey(), JSON.stringify(draftSlots)); }catch(e){}
  try{ sessionStorage.setItem(noteDraftKey(), draftNote); }catch(e){}
}
function clearDraftLocal(){
  try{ sessionStorage.removeItem(draftKey()); }catch(e){}
  try{ sessionStorage.removeItem(noteDraftKey()); }catch(e){}
}
function markDraftTouched(){
  draftTouched = true;
  saveDraftLocal();
  pendingSaveConfirm = null;
}
function isDraftDirty(){
  if(!myName) return false;
  var mine = serverMine();
  var sSlots = mine ? mine.slots : [];
  var sNote = mine ? (mine.note || "") : "";
  return !sameSlots(draftSlots, sSlots) || (draftNote || "").trim() !== sNote.trim();
}

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
}

/* ---------- Firestore live sync ---------- */
onSnapshot(collection(db,"people"), function(snap){
  var next = {};
  snap.forEach(function(d){
    var data = d.data() || {};
    next[d.id] = { slots: normalizeSlotList(data.slots), note: data.note || "" };
  });
  STATE.people = next;
  loaded.people = true;
  connError = false;
  if(myName && !draftTouched){ syncDraftFromServer(); }
  render();
}, function(err){
  console.error("people snapshot error", err);
  connError = true;
  render();
});

var voteKey = null;
var _pendingBallot = null;
var ballotTouched = false;
onSnapshot(doc(db,"meta","vote"), function(snap){
  if(snap.exists()){
    var v = snap.data();
    STATE.vote = {
      candidates: sortedSlots(normalizeSlotList(v.candidates)),
      ballots: v.ballots || {},
      finalized: v.finalized || null
    };
    Object.keys(STATE.vote.ballots).forEach(function(n){
      STATE.vote.ballots[n] = normalizeSlotList(STATE.vote.ballots[n]);
    });
    if(STATE.vote.finalized && STATE.vote.finalized.slot){
      STATE.vote.finalized.slot = normalizeSlot(STATE.vote.finalized.slot);
    }
    // 새 투표가 만들어지면 이전 투표의 선택을 버려요.
    var key = (v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : "") + "|" + STATE.vote.candidates.join(",");
    if(key !== voteKey){ voteKey = key; _pendingBallot = null; ballotTouched = false; }
  }else{
    STATE.vote = null;
    voteKey = null; _pendingBallot = null; ballotTouched = false;
  }
  if(!ballotTouched){ _pendingBallot = null; }
  loaded.vote = true;
  render();
}, function(err){
  console.error("vote snapshot error", err);
  loaded.vote = true;
});

function hasFullOverlap(peopleSlots){
  var names = Object.keys(peopleSlots);
  var active = names.filter(function(n){ return peopleSlots[n].length > 0; });
  if(active.length <= 1) return true;
  var counts = {};
  names.forEach(function(n){ peopleSlots[n].forEach(function(s){ counts[s] = (counts[s]||0) + 1; }); });
  return Object.keys(counts).some(function(k){ return counts[k] === names.length; });
}
// 지금은 모두 되는 시간이 있는데, 내 저장 때문에 그게 사라지는지 확인해요.
function saveWouldBreakFullOverlap(newSlots){
  var before = {}, after = {};
  Object.keys(STATE.people).forEach(function(n){
    before[n] = STATE.people[n].slots || [];
    if(n !== myName) after[n] = before[n];
  });
  if(newSlots.length) after[myName] = newSlots;
  return hasFullOverlap(before) && !hasFullOverlap(after);
}

// 마우스·터치·펜을 모두 Pointer Events 하나로 처리해요.
// 터치 드래그 중에는 손가락 아래 칸을 elementFromPoint로 찾아서 칠해요.
function bindGridDrag(gridEl, onToggle, selectedClass){
  selectedClass = selectedClass || "selected";
  gridEl.classList.add("drag-enabled");
  var activePointer = null;
  var mode = true;
  var lastSlot = null;
  function cellAt(x, y){
    var el = document.elementFromPoint(x, y);
    var cell = el && el.closest ? el.closest(".g-cell") : null;
    return (cell && gridEl.contains(cell)) ? cell : null;
  }
  function apply(cell){
    var slot = cell.getAttribute("data-slot");
    if(!slot || slot === lastSlot) return;
    lastSlot = slot;
    onToggle(slot, mode, cell);
  }
  gridEl.addEventListener("pointerdown", function(ev){
    if(ev.pointerType === "mouse" && ev.button !== 0) return;
    var cell = cellAt(ev.clientX, ev.clientY);
    if(!cell) return;
    activePointer = ev.pointerId;
    dragActive = true;
    lastSlot = null;
    mode = !cell.classList.contains(selectedClass);
    apply(cell);
    try{ gridEl.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  gridEl.addEventListener("pointermove", function(ev){
    if(activePointer !== ev.pointerId) return;
    var cell = cellAt(ev.clientX, ev.clientY);
    if(cell) apply(cell);
    ev.preventDefault();
  });
  function end(ev){
    if(activePointer !== ev.pointerId) return;
    activePointer = null;
    lastSlot = null;
    try{ gridEl.releasePointerCapture(ev.pointerId); }catch(e){}
    dragActive = false;
    // 드래그 중에 다른 사람이 저장해서 밀린 화면 갱신을 이제 해요.
    if(renderQueued){ renderQueued = false; render(); }
  }
  gridEl.addEventListener("pointerup", end);
  gridEl.addEventListener("pointercancel", end);
  gridEl.addEventListener("lostpointercapture", end);
  // 키보드: 칸에 포커스 두고 Enter/Space로 칠하기
  gridEl.addEventListener("keydown", function(ev){
    if(ev.key !== "Enter" && ev.key !== " ") return;
    var cell = ev.target.closest ? ev.target.closest(".g-cell") : null;
    if(!cell) return;
    ev.preventDefault();
    onToggle(cell.getAttribute("data-slot"), !cell.classList.contains(selectedClass), cell);
  });
}

  return arr.slice(0, limit);
}

function heatDecorator(people, weekStart, opts){
  opts = opts || {};
  var counts = countsFor(people);
  var pc = Object.keys(people || {}).length;
  var lo = cssVar("--heat-low") || "#f6dfcb";
  var hi = cssVar("--heat-high") || "#bf4a22";
  var mine = (opts.me && people[opts.me] && people[opts.me].slots) || [];
  return function(id){
    var c = counts[id] || 0;
    var ratio = pc ? c / pc : 0;
    var cls = [];
    var style = "";
    var isFull = c === pc && pc > 0;
    if(isFull){
      cls.push("full");
    }else if(c > 0){
      cls.push("heat");
      if(ratio >= .55) cls.push("hot");
      style = "background:" + heatColor(pc > 1 ? (c - 1) / (pc - 1) : 1, lo, hi) + ";";
    }
    if(mine.indexOf(id) !== -1) cls.push("mine");
    if(opts.picked && opts.picked === id) cls.push("picked");
    if(opts.readonly) cls.push("readonly");
    var title = formatSlot(id, weekStart) + " — " + c + "/" + pc + "명 가능";
    return { className: cls.join(" "), style: style, inner: isFull ? "★" : "", title: title };
  };
}

function tally(vote){
  var counts = {};
  (vote.candidates||[]).forEach(function(c){ counts[c] = 0; });
  Object.keys(vote.ballots||{}).forEach(function(name){
    (vote.ballots[name]||[]).forEach(function(c){ if(counts[c] !== undefined) counts[c]++; });
  });
  return counts;
}

  if(!vote.finalized && notVoted.length){

    html += '<button class="btn btn-primary" data-action="submit-ballot"' + (isSaving?' disabled':'') + '>' + (isSaving?'<span class="spinner"></span>제출 중…':(submittedBallot ? '투표 수정' : '투표 제출')) + '</button>';

    html += '<div class="btn-row" style="margin-top:16px;justify-content:flex-start;"><button class="btn btn-ghost" data-action="cancel-vote">확정 취소하고 새 투표</button></div>';

function weekRangeLabelFor(startISO){

}

function captureFocusState(){
  var active = document.activeElement;
  if(active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA") && active.id){
    var st = { id: active.id, value: active.value, selStart: null, selEnd: null };
    try{ st.selStart = active.selectionStart; st.selEnd = active.selectionEnd; }catch(e){}
    return st;
  }
  return null;
}
function restoreFocusState(saved){
  if(!saved) return;
  var el = document.getElementById(saved.id);
  if(!el) return;
  if(el.type !== "date"){ el.value = saved.value; }
  el.focus();
  if(saved.selStart != null && el.setSelectionRange){ try{ el.setSelectionRange(saved.selStart, saved.selEnd); }catch(e){} }
}

function render(){
  // 드래그로 칠하는 중에 다른 사람의 저장이 들어와도 화면을 갈아엎지 않아요.
  if(dragActive){ renderQueued = true; return; }
  var app = document.getElementById("app");
  var saved = captureFocusState();
  if(!myName){
    app.innerHTML = renderNameGate();
    bindNameGateEvents();
    restoreFocusState(saved);
    return;
  }
  var html = '<div class="wrap">' + renderMasthead() + renderTabs() + '<main id="main">';
  if(currentTab === "input") html += renderInputTab();
  else if(currentTab === "heat") html += renderHeatTab();
  else if(currentTab === "history") html += renderHistoryTab();
  else html += renderVoteTab();
  html += '</main></div>';
  app.innerHTML = html;
  bindMainEvents();
  restoreFocusState(saved);
}

function bindNameGateEvents(){
  var form = document.getElementById("name-form");
  if(!form) return;
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    onNameSubmit(document.getElementById("name-input").value);
  });
  form.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest("[data-action]") : null;
    if(!el) return;
    var a = el.getAttribute("data-action");
    if(a === "name-confirm"){ onNameSubmit(pendingNameConfirm && pendingNameConfirm.name, true); }
    else if(a === "name-other"){
      pendingNameConfirm = null; render();
      var inp = document.getElementById("name-input");
      if(inp){ inp.value = ""; inp.focus(); }
    }
  });
  if(!pendingNameConfirm || pendingNameConfirm.error){
    var input = document.getElementById("name-input");
    if(input && !document.activeElement.closest("#name-form")) input.focus();
  }
}

var appBound = false;
function bindMainEvents(){
  var app = document.getElementById("app");
  if(!appBound){
    app.addEventListener("click", handleDelegatedClick);
    app.addEventListener("change", handleDelegatedChange);
    appBound = true;
  }

  var inputGrid = document.getElementById("input-grid");
  if(inputGrid){
    bindGridDrag(inputGrid, function(slot, willSelect, cell){
      toggleDraftSlot(slot, willSelect);
      cell.classList.toggle("selected", willSelect);
      cell.setAttribute("aria-pressed", willSelect ? "true" : "false");
      updateSaveBar();
    });
  }
  var candGrid = document.getElementById("cand-grid");
  if(candGrid){
    bindGridDrag(candGrid, function(slot, willSelect, cell){
      var idx = candidateDraft.indexOf(slot);
      if(willSelect && idx===-1) candidateDraft.push(slot);
      if(!willSelect && idx!==-1) candidateDraft.splice(idx,1);
      cell.classList.toggle("candidate", willSelect);
      cell.setAttribute("aria-pressed", willSelect ? "true" : "false");
      var btn = document.querySelector('[data-action="start-vote"]');
      if(btn) btn.textContent = "투표 시작 (" + candidateDraft.length + "개)";
    }, "candidate");
  }
  var heatGrid = document.getElementById("heat-grid");
  if(heatGrid){
    heatGrid.addEventListener("mouseover", handleHeatPick);
    heatGrid.addEventListener("click", handleHeatPick);
  }
  var noteInput = document.getElementById("note-input");
  if(noteInput){
    noteInput.addEventListener("input", function(){
      draftNote = noteInput.value;
      markDraftTouched();
      updateSaveBar();
    });
  }
  var pinInput = document.getElementById("host-pin-input");
  if(pinInput){
    if(document.activeElement !== pinInput) pinInput.focus();
    pinInput.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){
        ev.preventDefault();
        submitHostPin();
      }
    });
  }
}

function handleHeatPick(ev){
  var cell = ev.target.closest ? ev.target.closest(".g-cell") : null;
  if(!cell) return;
  var slot = cell.getAttribute("data-slot");
  if(slot === pickedHeatSlot) return;
  var prev = document.querySelector("#heat-grid .g-cell.picked");
  if(prev) prev.classList.remove("picked");
  cell.classList.add("picked");
  pickedHeatSlot = slot;
  var panel = document.getElementById("hover-info");
  if(panel) panel.innerHTML = renderDetailPanel();
}

function handleDelegatedChange(ev){
  var el = ev.target;
  if(el.id === "raid-len"){
    var v = parseInt(el.value, 10);
    if(v >= 1 && v <= 6){
      raidLenBlocks = v;
      try{ localStorage.setItem(RAID_LEN_KEY, String(v)); }catch(e){}
      render();
    }
    return;
  }
  if(el.getAttribute && el.getAttribute("data-action") === "toggle-ballot"){
    var slot = el.getAttribute("data-slot");
    var list = pendingBallot();
    var idx = list.indexOf(slot);
    if(el.checked && idx===-1) list.push(slot);
    if(!el.checked && idx!==-1) list.splice(idx,1);
    ballotTouched = true;
    var row = el.closest(".cand-row");
    if(row) row.classList.toggle("checked", el.checked);
    var st = document.querySelector(".my-ballot-state");
    if(st){ st.className = "my-ballot-state todo"; st.textContent = "아직 제출 안 했어요"; }
  }
}

function pendingBallot(){
  if(_pendingBallot === null){
    _pendingBallot = ((STATE.vote && STATE.vote.ballots && STATE.vote.ballots[myName]) || []).slice();
  }
  return _pendingBallot;
}

function copyInviteLink(){
  var url = location.href.split("#")[0];
  function done(){ showToast("초대 링크를 복사했어요. 공대 단톡방에 붙여넣으세요."); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, fallback);
  }else{ fallback(); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = url; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ showToast(url); }
    document.body.removeChild(ta);
  }
}

function handleDelegatedClick(ev){
  var el = ev.target.closest ? ev.target.closest("[data-action]") : null;
  if(!el || el.disabled) return;
  var action = el.getAttribute("data-action");
  if(action === "set-tab"){ setTab(el.getAttribute("data-tab")); }
  else if(action === "change-name"){ onChangeName(); }
  else if(action === "copy-link"){ copyInviteLink(); }
  else if(action === "reload"){ location.reload(); }
  else if(action === "clear-draft"){ doClearDraft(); }
  else if(action === "save-availability"){ doSaveAvailability(); }
  else if(action === "open-candidate-picker"){
    candidatePickerOpen = true;
    var top = topCandidates(8).filter(function(x){return x.count>0;});
    var maxC = top.length ? top[0].count : 0;
    candidateDraft = top.filter(function(x){ return x.count === maxC; }).map(function(x){return x.slot;});
    if(candidateDraft.length === 0 && top.length){ candidateDraft = [top[0].slot]; }
    render();
  }
  else if(action === "close-candidate-picker"){ candidatePickerOpen = false; render(); }
  else if(action === "start-vote"){ doStartVote(); }
  else if(action === "submit-ballot"){ doSubmitBallot(); }
  else if(action === "cancel-vote"){ withHostGate({ type: "cancel-vote" }); }
  else if(action === "finalize-vote"){ withHostGate({ type: "finalize-vote", slot: el.getAttribute("data-slot") }); }
  else if(action === "toggle-host-menu"){
    if(pendingHostAction){ pendingHostAction = null; pinError = null; hostMenuOpen = false; }
    else { hostMenuOpen = !hostMenuOpen; }
    resetWeekConfirmOpen = false; render();
  }
  else if(action === "close-host-menu"){ hostMenuOpen = false; resetWeekConfirmOpen = false; render(); }
  else if(action === "host-lock"){
    hostUnlocked = false; hostMenuOpen = false;
    try{ localStorage.removeItem(HOST_UNLOCK_KEY); }catch(e){}
    render(); showToast("방장 모드를 껐어요.");
  }
  else if(action === "open-reset-week"){ withHostGate({ type: "reset-week" }); }
  else if(action === "cancel-reset-week"){ resetWeekConfirmOpen = false; render(); }
  else if(action === "confirm-reset-week"){
    var dinput = document.getElementById("reset-week-date");
    var dval = (dinput && dinput.value) ? dinput.value : resetWeekDateValue;
    doResetWeek(dval);
  }
  else if(action === "cancel-host-pin"){ pendingHostAction = null; pinError = null; hostMenuOpen = false; render(); }
  else if(action === "submit-host-pin"){ submitHostPin(); }
  else if(action === "cancel-finalize-mismatch"){ pendingFinalizeConfirm = null; render(); }
  else if(action === "confirm-finalize-mismatch"){
    var slotToFinalize = pendingFinalizeConfirm;
    pendingFinalizeConfirm = null;
    if(slotToFinalize) doFinalizeVote(slotToFinalize);
  }
  else if(action === "cancel-save-warning"){ pendingSaveConfirm = null; render(); }
  else if(action === "confirm-save-warning"){ doSaveAvailability(true); }
  else if(action === "load-last-week"){ doLoadLastWeek(); }
  else if(action === "toggle-archive"){
    var aid = el.getAttribute("data-id");
    expandedArchives[aid] = !expandedArchives[aid];
    render();
  }
}

function withHostGate(action){
  if(hostUnlocked){ runHostAction(action); return; }
  pendingHostAction = action;
  pinError = null;
  render();
  window.scrollTo({ top: 0 });
}

function runHostAction(action){
  if(action.type === "cancel-vote"){ doCancelVote(); }
  else if(action.type === "finalize-vote"){
    var avail = countsPerSlot()[action.slot] || 0;
    var pc = expectedCount();
    if(avail < pc){
      pendingFinalizeConfirm = action.slot;
      render();
    }else{
      doFinalizeVote(action.slot);
    }
  }
  else if(action.type === "reset-week"){
    hostMenuOpen = true;
    resetWeekConfirmOpen = true;
    resetWeekDateValue = isoDateOnly(computeUpcomingWednesday(new Date()));
    render();
  }
}

function submitHostPin(){
  var input = document.getElementById("host-pin-input");
  var val = input ? input.value : "";
  if(val && val === HOST_PIN){
    hostUnlocked = true;
    try{ localStorage.setItem(HOST_UNLOCK_KEY, "1"); }catch(e){}
    var act = pendingHostAction;
    pendingHostAction = null;
    pinError = null;
    if(act){ hostMenuOpen = false; runHostAction(act); } else { render(); }
    showToast("방장 모드를 켰어요.");
  }else{
    pinError = "비밀번호가 올바르지 않아요.";
    render();
  }
}

async function removeMyBallotIfAny(){
  if(STATE.vote && STATE.vote.ballots && Object.prototype.hasOwnProperty.call(STATE.vote.ballots, myName)){
    try{
      // 이름에 공백·특수문자가 있어도 안전하게 FieldPath로 지워요.
      await updateDoc(doc(db,"meta","vote"), new FieldPath("ballots", myName), deleteField());
    }catch(e){ console.error(e); }
  }
}

async function doSaveAvailability(confirmed){
  if(isSaving) return;
  var slots = sortedSlots(draftSlots);
  var note = (draftNote || "").trim().slice(0,200);
  var isEmpty = slots.length === 0 && !note;
  if(!confirmed){
    if(isEmpty && serverMine()){ pendingSaveConfirm = "empty"; render(); return; }
    if(slots.length > 0 && saveWouldBreakFullOverlap(slots)){ pendingSaveConfirm = "overlap"; render(); return; }
  }
  pendingSaveConfirm = null;
  isSaving = true; render();
  try{
    if(isEmpty){
      await deleteDoc(doc(db,"people",myName));
      await removeMyBallotIfAny();
    }else{
      await setDoc(doc(db,"people",myName), { name: myName, slots: slots, note: note, updatedAt: serverTimestamp() });
    }
    clearDraftLocal();
    draftTouched = false;
    showToast(isEmpty ? "내 제출을 지웠어요." : "저장했어요. 공대원 화면에 바로 보여요.");
  }catch(err){
    console.error(err);
    showToast("저장하지 못했어요. 연결을 확인하고 다시 눌러주세요.");
  }
  isSaving = false; render();
}

function doClearDraft(){
  draftSlots = [];
  draftNote = "";
  markDraftTouched();
  render();
  if(serverMine()) showToast("화면에서 지웠어요. 저장해야 반영돼요.");
}

async function doStartVote(){
  if(candidateDraft.length === 0){ showToast("투표에 올릴 시간을 한 개 이상 골라주세요."); return; }
  isSaving = true; render();
  try{
    await setDoc(doc(db,"meta","vote"), {
      candidates: sortedSlots(candidateDraft),
      ballots: {},
      finalized: null,
      createdAt: serverTimestamp()
    });
    candidatePickerOpen = false;
    currentTab = "vote";
  }catch(err){
    console.error(err);
    showToast("투표를 만들지 못했어요.");
  }
  isSaving = false; render();
}

async function doSubmitBallot(){
  if(!STATE.vote) return;
  isSaving = true; render();
  try{
    await updateDoc(doc(db,"meta","vote"), new FieldPath("ballots", myName), sortedSlots(pendingBallot()));
    ballotTouched = false;
    showToast("투표를 제출했어요.");
  }catch(err){
    console.error(err);
    showToast("투표 제출에 실패했어요.");
  }
  isSaving = false; render();
}

async function doCancelVote(){
  isSaving = true; render();
  try{
    await deleteDoc(doc(db,"meta","vote"));
    _pendingBallot = null;
    ballotTouched = false;
    pendingFinalizeConfirm = null;
  }catch(err){ console.error(err); showToast("투표를 취소하지 못했어요."); }
  isSaving = false; render();
}

async function doFinalizeVote(slot){
  isSaving = true; render();
  try{
    await updateDoc(doc(db,"meta","vote"), { finalized: { slot: slot, decidedAt: new Date().toISOString() } });
    notifyDiscordFinalized(slot);
  }catch(err){
    console.error(err);
    showToast("확정에 실패했어요.");
  }
  isSaving = false; render();
}

function doLoadLastWeek(){
  var a = lastArchiveWithMe();
  if(!a) return;
  draftSlots = a.people[myName].slots.slice();
  markDraftTouched();
  render();
  showToast("지난번 시간을 불러왔어요. 확인하고 저장을 눌러주세요.");
}

function notifyDiscordFinalized(slot){
  if(!DISCORD_WEBHOOK_URL) return;
  try{
    fetch(DISCORD_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: "⚔ 레이드 시간이 확정됐어요: " + formatSlot(slot) })
    }).catch(function(e){ console.error("discord webhook failed", e); });
  }catch(e){ console.error(e); }
}

async function doResetWeek(dateStr){
  if(!dateStr){ showToast("새 주의 수요일 날짜를 골라주세요."); return; }
  isResetting = true; render();
  try{
    var names = Object.keys(STATE.people);
    // 보관·삭제·새 주 설정을 한 번에(원자적으로) 처리해서 중간에 끊겨도 반쯤 지워지지 않게 해요.
    var batch = writeBatch(db);
    if(names.length || STATE.vote){
      var weekId = isoDateOnly(getWeekStartDate());
      var archPeople = {};
      names.forEach(function(n){
        archPeople[n] = { slots: (STATE.people[n].slots || []).slice(), note: STATE.people[n].note || "" };
      });
      var archVote = null;
      if(STATE.vote){
        archVote = {
          candidates: (STATE.vote.candidates || []).slice(),
          ballots: STATE.vote.ballots || {},
          finalized: STATE.vote.finalized || null
        };
      }
      batch.set(doc(db,"archives",weekId), {
        startDate: weekId,
        people: archPeople,
        vote: archVote,
        archivedAt: serverTimestamp()
      });
    }
    names.forEach(function(n){ batch.delete(doc(db,"people",n)); });
    batch.delete(doc(db,"meta","vote"));
    batch.set(doc(db,"meta","week"), { startDate: dateStr });
    await batch.commit();
    draftSlots = [];
    draftNote = "";
    draftTouched = false;
    clearDraftLocal();
    hostMenuOpen = false;
    resetWeekConfirmOpen = false;
    showToast("이번 주 결과를 기록에 보관하고 새 주를 시작했어요.");
  }catch(err){
    console.error(err);
    showToast("초기화하지 못했어요. 아무것도 지워지지 않았으니 다시 시도해주세요.");
  }
  isResetting = false; render();
}

window.addEventListener("beforeunload", function(ev){
  if(isDraftDirty() && draftTouched){ ev.preventDefault(); ev.returnValue = ""; }
});

// 히트맵 색은 렌더할 때 CSS 변수에서 읽어오므로, 시스템 다크 모드가 바뀌면 다시 그려요.
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ render(); }); }catch(e){}

if(myName){ restoreLocalDraft(); }
render();

})();
</script>
